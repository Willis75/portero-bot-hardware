[env:portero-bot-v2]
platform = espressif32@6.5.0
board = esp32dev
framework = arduino

; ESP32-WROOM-32E-N16 (16MB flash)
board_build.partitions = partitions.csv
board_build.flash_mode = qio
board_build.flash_size = 16MB
board_build.flash_freq = 80m
board_upload.flash_size = 16MB
board_upload.maximum_size = 16777216

; Build flags
build_flags =
    -DCORE_DEBUG_LEVEL=3
    -DCONFIG_ARDUHAL_LOG_COLORS=1
    -DCONFIG_BOOTLOADER_LOG_LEVEL=3
    ; Brownout detector @ 2.43V (default but explicit)
    -DCONFIG_ESP32_BROWNOUT_DET=1
    -DCONFIG_ESP32_BROWNOUT_DET_LVL_SEL_7=1
    ; Task watchdog 5s
    -DCONFIG_ESP_TASK_WDT_TIMEOUT_S=5
    -DCONFIG_ESP_TASK_WDT_PANIC=1
    ; HTTP server max clients
    -DCONFIG_LWIP_MAX_SOCKETS=8

; Library dependencies
lib_deps =
    https://github.com/ayushsharma82/ElegantOTA.git#v3.1.5
    https://github.com/me-no-dev/ESPAsyncWebServer.git
    https://github.com/me-no-dev/AsyncTCP.git

; Upload settings (USB Micro-B + CH340C)
upload_speed = 921600
monitor_speed = 115200
monitor_filters = esp32_exception_decoder

; Optional: OTA update via Ethernet
; upload_protocol = espota
; upload_port = portero-bot.local

[platformio]
default_envs = portero-bot-v2
